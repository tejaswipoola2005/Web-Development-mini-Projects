<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Say's game</h1>
    <h2>Highest Score : </h2>
    <h3>click anywhere to start game</h3>
    <div class="container">
        <button class="box green" type="button" role="button" id="green"></button>
        <button class="box red" type="button" id="red"></button>
    </div>
    <div class="container">
         <button class="box yellow" type="button" id="yellow"></button>
        <button class="box violet" type="button" id="violet"></button>
    </div>
      
    <script src="app.js"></script>
</body>
</html>
